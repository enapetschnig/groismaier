# TEMPORÄR: Änderungswünsche für die laufende Entwicklungs-Sitzung abholen.
# Wird nach der Auswertung wieder entfernt. Ergebnis landet auf dem Branch
# claude/wuensche-abholung, weil Artefakt-Downloads aus der Sitzung heraus
# von der Netz-Policy blockiert werden.
name: Wünsche-Abholung (temporär)

on:
  push:
    branches: [claude/implement-requested-changes-yi1wqq]

permissions:
  contents: write

concurrency:
  group: wuensche-abholung-tmp
  cancel-in-progress: true

jobs:
  abholen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Meldungen + Dateien einsammeln und auf Branch legen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: tdehljzmqwmfgfoyyoee
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "::error::Secret fehlt."; exit 1; }
          mkdir -p abholung/dateien

          python3 - <<'PY' > /tmp/q.json
          import json
          json.dump({"query": """
            SELECT w.id, w.created_at, w.art, w.status, w.seite, w.text,
                   w.bild_pfad, w.audio_pfad, w.abschrift, w.abschrift_fehler, w.antwort,
                   COALESCE(p.vorname || ' ' || p.nachname, '') AS melder
              FROM aenderungswuensche w
              LEFT JOIN profiles p ON p.id = w.erstellt_von
             ORDER BY w.created_at
          """}, open("/tmp/q.json", "w"))
          PY
          curl -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" -d @/tmp/q.json > abholung/meldungen.json
          python3 -c "import json;d=json.load(open('abholung/meldungen.json'));print(f'{len(d)} Meldung(en)')"

          KEY=$(curl -sS "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys?reveal=true" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((k['api_key'] for k in d if k.get('name')=='service_role'), ''))")
          test -n "$KEY" || { echo "::error::Service-Schlüssel nicht erhalten."; exit 1; }

          python3 - "$KEY" "${PROJECT_REF}" <<'PY'
          import json, os, sys, urllib.request
          key, ref = sys.argv[1], sys.argv[2]
          basis = f"https://{ref}.supabase.co/storage/v1/object/aenderungswuensche/"
          daten = json.load(open("abholung/meldungen.json"))
          geholt = 0
          for w in daten:
              if w.get("status") not in ("neu", "gesehen"):
                  continue
              for feld in ("bild_pfad", "audio_pfad"):
                  pfad = w.get(feld)
                  if not pfad:
                      continue
                  ziel = os.path.join("abholung/dateien", f"{w['id'][:8]}_{os.path.basename(pfad)}")
                  req = urllib.request.Request(basis + pfad, headers={"Authorization": f"Bearer {key}", "apikey": key})
                  try:
                      with urllib.request.urlopen(req) as r, open(ziel, "wb") as f:
                          f.write(r.read())
                      geholt += 1
                  except Exception as e:
                      print(f"  ! {pfad}: {e}")
          print(f"{geholt} Datei(en) geholt")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan claude/wuensche-abholung
          git rm -rf --quiet . || true
          git add -f abholung
          git commit -m "Abholung der Aenderungswuensche (temporaer)"
          git push -f origin claude/wuensche-abholung
