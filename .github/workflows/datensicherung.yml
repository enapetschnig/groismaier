# Tägliche Sicherung der Datenbank (Kundenwunsch 19.09.2026: „1 x pro 24
# Stunden … die alten Daten werden auch irgendwann überschrieben")
#
# Jeden Tag: Datenbank-Dump → GitHub-Artefakt (90 Tage) UND als gepackte
# Datei in die App (Admin → Sicherheitskopie, Ordner „sicherungen/", die
# letzten 60 Tage; ältere werden gelöscht — die Rotation, die der Betrieb
# von der externen Festplatte kennt).
# Am 1. des Monats und bei Handstart zusätzlich das komplette Übergabepaket.
#
# Warum hier und nicht auf einem Rechner: Ein Sicherungslauf, den jemand von
# Hand starten muss, wird irgendwann vergessen. Hier läuft er von allein, an
# einem festen Tag, und meldet sich, wenn er scheitert.
#
# Gesichert wird die DATENBANK (rund 32 MB) — Kunden, Belege, Positionen,
# Stunden, Projekte, Benutzer. NICHT die hinterlegten Dateien (~950 MB Fotos
# und PDFs): Die wären für den Artefakt-Speicher von GitHub zu gross und
# aendern sich langsamer. Dafuer gibt es skripte/dateien-sichern.mjs.
#
# ── Was einmalig einzurichten ist ────────────────────────────────────────────
#
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#
#   SUPABASE_DB_URL   (Pflicht)
#     Die Verbindungszeichenfolge aus dem Supabase-Dashboard unter
#     Project Settings → Database → Connection string → Session pooler.
#     Wichtig: den SESSION-Pooler auf Port 5432 nehmen, nicht den
#     Transaction-Pooler auf 6543 — pg_dump braucht eine echte Sitzung.
#     Sonderzeichen im Passwort muessen prozentkodiert sein.
#
#   SICHERUNG_PASSWORT   (empfohlen)
#     Wird es gesetzt, ist die Sicherung mit AES verschluesselt. Ohne dieses
#     Secret liegt sie im Klartext im Artefakt — und darin stehen saemtliche
#     Kunden- und Mitarbeiterdaten. Das Passwort gehoert in den Passwort-
#     Tresor, NICHT in dieses Repository.
#
#     Entschluesseln spaeter (openssl ist auf jedem Mac und Linux schon da,
#     es muss nichts installiert werden — das war der Grund gegen gpg):
#
#       openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
#         -in 01_firmendaten_JJJJ-MM-TT.sql.enc \
#         -out 01_firmendaten.sql -pass pass:'<das Passwort>'
#
#     Bequemer: skripte/sicherung-oeffnen.sh <ordner>
#
name: Datensicherung

on:
  schedule:
    # täglich 03:00 UTC (04:00 bzw. 05:00 österreichischer Zeit)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      hinweis:
        description: "Notiz zu dieser Sicherung (z. B. vor Übergabe)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  sichern:
    runs-on: ubuntu-latest
    steps:
      # Wird fuer den Paketbau gebraucht (Skripte und Anleitungen). Fuer den
      # reinen Datenbank-Dump waere es nicht noetig.
      - uses: actions/checkout@v4

      - name: Zugangsdaten vorhanden?
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${DB_URL}" ]; then
            echo "::error::Repository-Secret SUPABASE_DB_URL fehlt. Anlegen unter Settings → Secrets and variables → Actions (Session-Pooler-URL, Port 5432)."
            exit 1
          fi

      # Supabase laeuft auf Postgres 17. Der auf dem Runner vorinstallierte
      # Client ist aelter und bricht mit "server version mismatch" ab.
      - name: pg_dump 17 installieren
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      # Zuerst nur anklopfen. Ohne diesen Schritt scheitert erst pg_dump, und
      # in dessen Meldung geht der eigentliche Grund unter.
      - name: Verbindung pruefen
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          if /usr/lib/postgresql/17/bin/psql "$DB_URL" -Atc "select 1" > /dev/null 2>/tmp/fehler.txt; then
            echo "✓ Verbindung steht."
            exit 0
          fi
          MELDUNG=$(cat /tmp/fehler.txt)
          echo "$MELDUNG"
          if echo "$MELDUNG" | grep -qi "password authentication failed"; then
            echo "::error::Das Datenbank-Passwort in SUPABASE_DB_URL stimmt nicht (mehr). So wird es erneuert: Supabase-Dashboard → Project Settings → Database → Reset database password. Danach unter Connection string → Session pooler (Port 5432!) die neue Zeile kopieren und hier als Secret SUPABASE_DB_URL hinterlegen."
          elif echo "$MELDUNG" | grep -qiE "could not translate|no route to host|timeout|Connection refused"; then
            echo "::error::Der Server ist nicht erreichbar. Haeufigste Ursache: die DIREKTE Verbindung (db.<kennung>.supabase.co) wurde eingetragen — die ist nur ueber IPv6 erreichbar, GitHub-Runner koennen das nicht. Es muss der SESSION-Pooler auf Port 5432 sein."
          else
            echo "::error::Verbindung fehlgeschlagen. Meldung siehe oben."
          fi
          exit 1

      - name: Datenbank sichern
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          PGDUMP=/usr/lib/postgresql/17/bin/pg_dump
          DATUM=$(date -u +%Y-%m-%d)
          mkdir -p sicherung

          # Drei getrennte Dumps statt einem grossen:
          #  - public  → die eigentlichen Firmendaten (muss klappen)
          #  - auth    → die Anmeldedaten der Mitarbeiter (Passwoerter bleiben gueltig)
          #  - storage → Verzeichnis der hinterlegten Dateien (nicht die Dateien selbst)
          # Getrennt, damit ein Rechteproblem bei auth/storage nicht die
          # Firmendaten mitreisst.

          echo "── Firmendaten (Schema public) ──"
          "$PGDUMP" "$DB_URL" \
            --schema=public --no-owner --no-privileges --quote-all-identifiers \
            -f "sicherung/01_firmendaten_${DATUM}.sql"
          echo "✓ $(du -h "sicherung/01_firmendaten_${DATUM}.sql" | cut -f1)"

          echo "── Benutzer (Schema auth) ──"
          if "$PGDUMP" "$DB_URL" \
               --schema=auth --no-owner --no-privileges --quote-all-identifiers \
               -f "sicherung/02_benutzer_${DATUM}.sql"; then
            echo "✓ $(du -h "sicherung/02_benutzer_${DATUM}.sql" | cut -f1)"
          else
            echo "::warning::auth-Schema nicht sicherbar (fehlende Rechte) — Benutzer muessten im Notfall neu angelegt werden."
          fi

          echo "── Dateiverzeichnis (Schema storage) ──"
          if "$PGDUMP" "$DB_URL" \
               --schema=storage --no-owner --no-privileges --quote-all-identifiers \
               -f "sicherung/03_dateiverzeichnis_${DATUM}.sql"; then
            echo "✓ $(du -h "sicherung/03_dateiverzeichnis_${DATUM}.sql" | cut -f1)"
          else
            echo "::warning::storage-Schema nicht sicherbar — nur die Metadaten fehlen, die Dateien selbst liegen ohnehin separat."
          fi

          # Ein Inhaltsverzeichnis, damit man Monate spaeter sieht, was drin ist,
          # ohne eine 30-MB-Datei oeffnen zu muessen.
          {
            echo "Sicherung der App Holzbau Groismaier"
            echo "Erstellt: $(date -u '+%d.%m.%Y %H:%M') UTC"
            [ -n "${{ inputs.hinweis }}" ] && echo "Notiz: ${{ inputs.hinweis }}"
            echo
            echo "Dateien:"
            ls -lh sicherung/ | tail -n +2 | awk '{print "  " $9 "  (" $5 ")"}'
            echo
            echo "Zurueckspielen:"
            echo "  psql \"\$DATENBANK_URL\" -f 01_firmendaten_*.sql"
            echo
            echo "Nicht enthalten: die hinterlegten Dateien (Fotos, PDFs, ~950 MB)."
            echo "Die werden mit skripte/dateien-sichern.mjs getrennt gesichert."
          } > sicherung/INHALT.txt
          cat sicherung/INHALT.txt

      - name: Verschluesseln, falls Passwort hinterlegt
        env:
          PASSWORT: ${{ secrets.SICHERUNG_PASSWORT }}
        run: |
          set -euo pipefail
          # Ohne Secret bleibt die Sicherung im Klartext — bewusst so, solange
          # nur der Betrieb selbst Zugang zu diesem Repository hat. Eine
          # Verschluesselung waere hier keine Sicherheit, sondern nur eine
          # weitere Huerde im Ernstfall: Wer das Passwort nicht findet, kommt
          # an die Sicherung nicht mehr heran.
          #
          # Sobald jemand Aussenstehendes Zugriff auf dieses Repository
          # bekommt, gehoert das Secret wieder gesetzt.
          if [ -z "${PASSWORT}" ]; then
            echo "Kein SICHERUNG_PASSWORT hinterlegt — die Sicherung bleibt unverschluesselt."
            echo "Das ist so gewollt, solange nur der Betrieb Zugang zu diesem Repository hat."
            exit 0
          fi
          # AES-256 ueber openssl, nicht gpg: openssl liegt auf jedem Mac und
          # jedem Linux bereits vor. gpg muesste im Ernstfall erst installiert
          # werden — ausgerechnet in dem Moment, in dem etwas brennt.
          # Verschluesseln — und JEDE Datei sofort gegenpruefen. Eine Sicherung,
          # die sich nicht wieder oeffnen laesst, ist schlimmer als gar keine,
          # denn das faellt erst dann auf, wenn man sie braucht.
          #
          # Geprueft wird gegen eine Datei, nicht gegen eine Pipe: Ein
          # "openssl … | head -c 200" schliesst die Pipe vorzeitig, openssl
          # bekommt SIGPIPE, und unter "set -o pipefail" gilt die ganze
          # Pruefung als fehlgeschlagen — obwohl die Verschluesselung in
          # Ordnung ist. Genau das ist hier einmal passiert.
          for f in sicherung/*.sql; do
            GROESSE_VORHER=$(wc -c < "$f")
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
              -in "$f" -out "${f%.sql}.sql.enc" -pass env:PASSWORT

            PROBE=$(mktemp)
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
                   -in "${f%.sql}.sql.enc" -out "$PROBE" -pass env:PASSWORT 2>/dev/null; then
              rm -f "$PROBE"
              echo "::error::$(basename "$f") laesst sich mit dem hinterlegten Passwort nicht wieder oeffnen. Abbruch, damit keine unbrauchbare Sicherung abgelegt wird."
              exit 1
            fi
            # Bytegenau gleich gross? Dann ist wirklich alles zurueckgekommen,
            # nicht nur der Anfang der Datei.
            GROESSE_NACHHER=$(wc -c < "$PROBE")
            rm -f "$PROBE"
            if [ "$GROESSE_VORHER" != "$GROESSE_NACHHER" ]; then
              echo "::error::$(basename "$f") kommt nicht vollstaendig zurueck (${GROESSE_VORHER} Bytes hinein, ${GROESSE_NACHHER} heraus). Abbruch."
              exit 1
            fi
            echo "  ✓ $(basename "${f%.sql}.sql.enc") — Gegenprobe bytegenau"
            rm "$f"
          done
          echo "✓ Alle Dateien verschluesselt und wieder lesbar."

          # Die Anleitung wandert mit ins Paket — im Ernstfall sucht niemand
          # in einer Workflow-Datei nach dem Befehl.
          cat > sicherung/ENTSCHLUESSELN.txt <<'ANLEITUNG'
          Diese Sicherung ist mit AES-256 verschluesselt.
          Das Passwort liegt im Passwort-Tresor (Secret SICHERUNG_PASSWORT).

          Oeffnen — funktioniert auf jedem Mac und Linux ohne Installation:

            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in 01_firmendaten_JJJJ-MM-TT.sql.enc \
              -out 01_firmendaten.sql \
              -pass pass:'DAS-PASSWORT'

          Fuer alle Dateien auf einmal:

            skripte/sicherung-oeffnen.sh <dieser Ordner>

          Danach einspielen:

            psql "$DATENBANK_URL" -f 01_firmendaten.sql
          ANLEITUNG

      - name: Tagessicherung in die App legen (Rotation 60 Tage)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: tdehljzmqwmfgfoyyoee
        run: |
          set -euo pipefail
          DATUM=$(date -u +%Y-%m-%d)
          # Alle Dumps des Tages in EINE gepackte Datei (ca. 5 MB statt 32).
          tar -czf "/tmp/sicherung_${DATUM}.tar.gz" -C sicherung .
          echo "Tagessicherung: $(du -h /tmp/sicherung_${DATUM}.tar.gz | cut -f1)"

          KEYS=$(curl -sS "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys" \
                   -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}") || KEYS=""
          SERVICE_KEY=$(echo "$KEYS" | jq -r '.[]? | select(.name=="service_role") | .api_key' 2>/dev/null || true)
          if [ -z "$SERVICE_KEY" ] || [ "$SERVICE_KEY" = "null" ]; then
            echo "::warning::Service-Role-Key nicht abrufbar (Token abgelaufen?) — Tagessicherung bleibt nur als Artefakt."
            exit 0
          fi
          ST="https://${PROJECT_REF}.supabase.co/storage/v1"
          HTTP=$(curl -sS -o /tmp/up.json -w "%{http_code}" -X POST "${ST}/object/uebergabe/sicherungen/sicherung_${DATUM}.tar.gz" \
            -H "Authorization: Bearer ${SERVICE_KEY}" -H "Content-Type: application/gzip" -H "x-upsert: true" \
            --data-binary "@/tmp/sicherung_${DATUM}.tar.gz")
          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then echo "✓ sicherungen/sicherung_${DATUM}.tar.gz liegt in der App."; else echo "HTTP ${HTTP}"; cat /tmp/up.json; echo "::warning::Hochladen fehlgeschlagen."; exit 0; fi

          # Rotation: alles älter als 60 Tage im Ordner sicherungen/ löschen.
          GRENZE=$(date -u -d "60 days ago" +%Y-%m-%d)
          curl -sS -o /tmp/liste.json -X POST "${ST}/object/list/uebergabe" \
            -H "Authorization: Bearer ${SERVICE_KEY}" -H "Content-Type: application/json" \
            --data "{\"prefix\":\"sicherungen/\",\"limit\":1000}"
          ALT=$(jq -r --arg g "$GRENZE" '.[]? | .name | select(test("^sicherung_[0-9]{4}-[0-9]{2}-[0-9]{2}\\.tar\\.gz$")) | select((.[10:20]) < $g)' /tmp/liste.json || true)
          if [ -n "$ALT" ]; then
            PFADE=$(echo "$ALT" | jq -R -s 'split("\n") | map(select(length>0)) | map("sicherungen/" + .)')
            curl -sS -o /dev/null -X DELETE "${ST}/object/uebergabe" \
              -H "Authorization: Bearer ${SERVICE_KEY}" -H "Content-Type: application/json" \
              --data "{\"prefixes\":${PFADE}}"
            echo "✓ Rotation: $(echo "$ALT" | wc -l | tr -d ' ') Sicherung(en) älter als ${GRENZE} gelöscht."
          else
            echo "Rotation: nichts älter als ${GRENZE}."
          fi

      - name: Paket heute bauen?
        run: |
          # Nur am 1. des Monats oder bei Handstart — das Paket ist ~20 MB und ändert sich langsam.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%d)" = "01" ]; then echo "PAKET=ja" >> "$GITHUB_ENV"; else echo "PAKET=nein" >> "$GITHUB_ENV"; fi

      # ────────────────────────────────────────────────────────────────────
      # Das komplette Uebergabepaket bauen und in die App legen
      #
      # "perfekt waere wenn das backup zip direkt in der app waere, dass ich
      #  gar nix per wetransfer schicken muss" (Kundenwunsch 10.09.2026)
      #
      # Der Chef laedt es im Admin-Bereich mit einem Klick herunter. Dadurch
      # ist es nie veraltet, und es muss nichts verschickt werden.
      # ────────────────────────────────────────────────────────────────────
      - name: Node einrichten
        if: env.PAKET == 'ja'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Uebergabepaket bauen
        if: env.PAKET == 'ja'
        env:
          SICHERUNG_ORDNER: ${{ github.workspace }}/sicherung
        run: |
          set -euo pipefail
          # Ohne Historie: Sie macht 85 der 105 MB aus, und wer sie braucht,
          # kommt ohnehin an das Repository heran.
          MIT_HISTORIE=nein ./skripte/uebergabe-paket.sh /tmp/Groismaier-App < /dev/null
          ls -lh /tmp/Groismaier-App.zip

      - name: Paket in die App hochladen
        if: env.PAKET == 'ja'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: tdehljzmqwmfgfoyyoee
        run: |
          set -euo pipefail

          # Den Service-Role-Key zur Laufzeit ueber die Management-API holen,
          # statt ihn als weiteres Secret zu hinterlegen: ein Schluessel
          # weniger, der irgendwo herumliegt und veralten kann.
          KEYS=$(curl -sS "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys" \
                   -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
          SERVICE_KEY=$(echo "$KEYS" | jq -r '.[] | select(.name=="service_role") | .api_key')
          if [ -z "$SERVICE_KEY" ] || [ "$SERVICE_KEY" = "null" ]; then
            echo "::warning::Service-Role-Key nicht abrufbar — das Paket bleibt als Artefakt verfuegbar, landet aber nicht in der App."
            exit 0
          fi

          # x-upsert: es soll immer nur EINE aktuelle Fassung geben, sonst
          # waechst die Ablage jeden Monat um 20 MB.
          HTTP=$(curl -sS -o /tmp/upload.json -w "%{http_code}" \
            -X POST "https://${PROJECT_REF}.supabase.co/storage/v1/object/uebergabe/Groismaier-App.zip" \
            -H "Authorization: Bearer ${SERVICE_KEY}" \
            -H "Content-Type: application/zip" \
            -H "x-upsert: true" \
            --data-binary @/tmp/Groismaier-App.zip)

          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
            echo "✓ Paket liegt in der App bereit ($(du -h /tmp/Groismaier-App.zip | cut -f1))."
          else
            echo "HTTP ${HTTP}"; cat /tmp/upload.json
            echo "::warning::Hochladen fehlgeschlagen — das Paket bleibt als Artefakt verfuegbar."
          fi

      - name: Ablegen
        uses: actions/upload-artifact@v5
        with:
          name: sicherung-${{ github.run_number }}
          path: sicherung/
          # 90 Tage ist das Maximum, das dieses Repository zulaesst — ein
          # hoeherer Wert wird stillschweigend auf 90 gekappt. Die Grenze
          # steht unter Settings → Actions → General → Artifact retention.
          #
          # Wichtig zu wissen: Nach 90 Tagen ist die Sicherung WEG. Wer sie
          # laenger braucht (Jahresabschluss, Uebergabe), laedt sie herunter
          # und legt sie in den Cloud-Ordner.
          retention-days: 90

      - name: Zusammenfassung
        run: |
          {
            echo "## Sicherung erstellt"
            echo
            echo "| Datei | Grösse |"
            echo "|---|---|"
            ls -lh sicherung/ | tail -n +2 | awk '{print "| " $9 " | " $5 " |"}'
            echo
            echo "Herunterladen: unten unter **Artifacts**. Aufbewahrt: 90 Tage — danach geloescht."
            echo
            echo "> Nicht enthalten: Fotos und PDFs (~950 MB). Getrennt sichern mit \`node skripte/dateien-sichern.mjs\`."
          } >> "$GITHUB_STEP_SUMMARY"
