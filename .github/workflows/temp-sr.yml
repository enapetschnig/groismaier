name: temp-sr
on: workflow_dispatch
jobs:
  lesen:
    runs-on: ubuntu-latest
    steps:
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          Q() { python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$1" | curl -sS -X POST "https://api.supabase.com/v1/projects/tdehljzmqwmfgfoyyoee/database/query" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d @-; }
          echo "KOPF>>>"
          Q "SELECT typ, nummer, status, datum, netto_summe, mwst_betrag, brutto_summe, rabatt_prozent, rabatt_betrag, bezahlt_betrag, skonto_prozent, skonto_tage, nettofrist, zahlungsbedingungen, parent_invoice_id, project_id, kunde_name, dokument_bezeichnung, schlusstext FROM invoices WHERE id='af88493c-295f-426f-a682-f2e8b9857a7b';"
          echo ""
          echo "POSITIONEN>>>"
          Q "SELECT position, left(coalesce(kurztext,beschreibung),70) AS text, menge, einheit, einzelpreis, rabatt_prozent, gesamtpreis, mwst_exempt, gruppe, ist_gruppensumme FROM invoice_items WHERE invoice_id='af88493c-295f-426f-a682-f2e8b9857a7b' ORDER BY position;"
          echo ""
          echo "KETTE>>>"
          Q "SELECT id, typ, nummer, status, brutto_summe, bezahlt_betrag, parent_invoice_id FROM invoices WHERE project_id=(SELECT project_id FROM invoices WHERE id='af88493c-295f-426f-a682-f2e8b9857a7b') ORDER BY datum;"
          echo ""
          echo "ZAHLUNGEN>>>"
          Q "SELECT invoice_id, betrag, datum, zahlungsart FROM payments WHERE invoice_id IN (SELECT id FROM invoices WHERE project_id=(SELECT project_id FROM invoices WHERE id='af88493c-295f-426f-a682-f2e8b9857a7b')) ORDER BY datum;" 2>/dev/null || echo "keine payments-Tabelle"
