name: temp-sr
on: workflow_dispatch
jobs:
  lesen:
    runs-on: ubuntu-latest
    steps:
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          Q() { python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$1" | curl -sS -X POST "https://api.supabase.com/v1/projects/tdehljzmqwmfgfoyyoee/database/query" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d @-; }
          echo "KOPF>>>"
          Q "SELECT typ, nummer, status, datum, netto_summe, mwst_betrag, brutto_summe, rabatt_prozent, rabatt_betrag, bezahlt_betrag, skonto_prozent, skonto_tage, nettofrist, parent_invoice_id, project_id, kunde_name FROM invoices WHERE id='af88493c-295f-426f-a682-f2e8b9857a7b';"
          echo ""
          echo "ANZAHLUNG>>>"
          Q "SELECT id, typ, nummer, status, datum, brutto_summe, bezahlt_betrag, project_id, parent_invoice_id FROM invoices WHERE id='7f930e08-f142-44e9-8788-966a3d60f3a0' OR nummer LIKE '%2026-044%';"
          echo ""
          echo "TEXTSPALTEN>>>"
          Q "SELECT column_name FROM information_schema.columns WHERE table_name='invoices' AND column_name ~ 'text|zahlung|bedingung|fuss|schluss';"
