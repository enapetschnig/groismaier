name: temp-kat
on: workflow_dispatch
jobs:
  lesen:
    runs-on: ubuntu-latest
    steps:
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 -c "import json; print(json.dumps({'query': \"SELECT id, name, typ, sort, aktiv, created_at::date AS seit FROM kalkulation_kategorien ORDER BY typ, sort, created_at;\"}))" \
          | curl -sS -X POST "https://api.supabase.com/v1/projects/tdehljzmqwmfgfoyyoee/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d @- \
          | python3 -c "
          import json,sys
          for r in json.load(sys.stdin):
              print('AUSGABE|', r['typ'], '|', r['sort'], '|', r['seit'], '|', r['name'], '|', r['id'][:8])
          "
