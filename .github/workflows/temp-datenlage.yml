name: temp-datenlage
on: workflow_dispatch
jobs:
  messen:
    runs-on: ubuntu-latest
    steps:
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          Q="SELECT 'Belege gesamt' AS was, count(*)::text AS zahl FROM invoices
             UNION ALL SELECT 'davon Angebote', count(*)::text FROM invoices WHERE typ='angebot'
             UNION ALL SELECT 'davon Rechnungen', count(*)::text FROM invoices WHERE typ IN ('rechnung','schlussrechnung')
             UNION ALL SELECT 'Positionen gesamt', count(*)::text FROM invoice_items
             UNION ALL SELECT 'Positionen mit Preis>0', count(*)::text FROM invoice_items WHERE einzelpreis > 0
             UNION ALL SELECT 'verschiedene Positionstexte', count(DISTINCT lower(btrim(coalesce(kurztext,beschreibung))))::text FROM invoice_items WHERE einzelpreis > 0
             UNION ALL SELECT 'Kalkulationen', count(*)::text FROM kalkulationen
             UNION ALL SELECT 'Artikel im Katalog', count(*)::text FROM invoice_templates WHERE ist_aktiv
             UNION ALL SELECT 'Projekte', count(*)::text FROM projects
             UNION ALL SELECT 'Projekte mit Soll UND Ist', count(*)::text FROM projects p
                WHERE EXISTS (SELECT 1 FROM invoices i WHERE i.project_id=p.id AND i.typ IN ('angebot','auftragsbestaetigung'))
                  AND EXISTS (SELECT 1 FROM time_entries t WHERE t.project_id=p.id)
             UNION ALL SELECT 'Zeitbuchungen', count(*)::text FROM time_entries
             UNION ALL SELECT 'Aeltester Beleg', coalesce(min(datum)::text,'-') FROM invoices
             UNION ALL SELECT 'Neuester Beleg', coalesce(max(datum)::text,'-') FROM invoices;"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$Q" \
          | curl -sS -X POST "https://api.supabase.com/v1/projects/tdehljzmqwmfgfoyyoee/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d @- \
          | python3 -c "
          import json,sys
          for r in json.load(sys.stdin): print('MESS>>>', r['was'].ljust(30), r['zahl'])
          "
