# Supabase-Deploy per Hand-Auslösung (workflow_dispatch):
#   1. spielt die beiden Migrationen 20260818* über die Management-API ein
#   2. verifiziert, dass die neuen Spalten wirklich existieren
#   3. deployt die Edge Function mail-postfach
#
# Der Access Token kommt aus dem Repository-Secret SUPABASE_ACCESS_TOKEN
# (Repo → Settings → Secrets and variables → Actions). Er taucht in keinem
# Log auf und steht nicht im Repo.
name: Supabase Deploy

# Zwei Auslöser: von Hand (Actions-Tab, sobald der Workflow auf main liegt)
# ODER per Tag "supabase-deploy-*" — Letzteres, weil die GitHub-App der
# Claude-Umgebung workflow_dispatch nicht aufrufen darf, Tags pushen aber schon.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase Projekt-Ref"
        required: false
        default: "tdehljzmqwmfgfoyyoee"
        type: string
  push:
    tags:
      - "supabase-deploy-*"
    branches:
      - "supabase-deploy/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Token vorhanden?
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Repository-Secret SUPABASE_ACCESS_TOKEN fehlt — bitte unter Settings → Secrets and variables → Actions anlegen."
            exit 1
          fi

      - name: Migrationen einspielen + verifizieren
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project_ref || 'tdehljzmqwmfgfoyyoee' }}
        run: |
          set -euo pipefail

          # SQL-Datei/-String über die Management-API ausführen.
          # $2 = "weich": Fehler nur melden, Job läuft weiter.
          sql_datei() {
            jq -Rs '{query: .}' < "$1" > /tmp/payload.json
            local http
            http=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data @/tmp/payload.json)
            echo "→ $1: HTTP ${http}"
            cat /tmp/resp.json; echo
            if [ "${http}" -lt 200 ] || [ "${http}" -ge 300 ]; then
              [ "${2:-}" = "weich" ] && { echo "(weicher Schritt — wird übersprungen)"; return 0; }
              return 1
            fi
          }

          sql_datei supabase/migrations/20260818100000_eingangsrechnung_lager.sql
          sql_datei supabase/migrations/20260818110000_regie_sammelrechnung.sql

          # Migrations-Historie nachtragen, damit ein späterer `supabase db push`
          # die beiden Dateien nicht erneut anwendet (best effort).
          cat > /tmp/history.sql <<'SQL'
          insert into supabase_migrations.schema_migrations (version, name, statements)
          values
            ('20260818100000', 'eingangsrechnung_lager', array['-- eingespielt über Management-API (GitHub Action)']),
            ('20260818110000', 'regie_sammelrechnung',   array['-- eingespielt über Management-API (GitHub Action)'])
          on conflict (version) do nothing;
          SQL
          sql_datei /tmp/history.sql weich

          # Verifikation: alle vier Neuerungen müssen da sein.
          cat > /tmp/verify.sql <<'SQL'
          select
            (select count(*) from information_schema.columns
              where table_schema='public' and table_name='purchase_invoices' and column_name='lager')                as pi_lager,
            (select count(*) from information_schema.columns
              where table_schema='public' and table_name='purchase_invoice_allocations' and column_name='ziel')     as alloc_ziel,
            (select count(*) from information_schema.columns
              where table_schema='public' and table_name='disturbances' and column_name='verrechnet_in_invoice_id') as dist_link,
            (select count(*) from public.app_settings where key='regie_stundensatz')                                as regie_satz;
          SQL
          sql_datei /tmp/verify.sql
          echo "Verifikation:"
          cat /tmp/resp.json | jq .
          test "$(jq -r '.[0] | (.pi_lager|tostring)+(.alloc_ziel|tostring)+(.dist_link|tostring)+(.regie_satz|tostring)' /tmp/resp.json)" = "1111" \
            || { echo "::error::Verifikation fehlgeschlagen — nicht alle Spalten/Seeds vorhanden"; exit 1; }
          echo "✓ Beide Migrationen eingespielt und verifiziert."

      - name: Edge Function mail-postfach deployen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project_ref || 'tdehljzmqwmfgfoyyoee' }}
        run: |
          set -euo pipefail
          npx --yes supabase@2 functions deploy mail-postfach --project-ref "${PROJECT_REF}" --use-api \
            || npx --yes supabase@2 functions deploy mail-postfach --project-ref "${PROJECT_REF}"
          echo "✓ mail-postfach deployt."
