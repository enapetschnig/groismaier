# Supabase-Deploy:
#   1. spielt alle noch nicht eingespielten Migrationen ab 20260818 über die
#      Management-API ein (Abgleich gegen supabase_migrations.schema_migrations)
#   2. deployt die Edge Function mail-postfach
#
# Der Access Token kommt aus dem Repository-Secret SUPABASE_ACCESS_TOKEN
# (Repo → Settings → Secrets and variables → Actions). Er taucht in keinem
# Log auf und steht nicht im Repo.
#
# Ausweichweg (18.09.2026): Der Token war nach einem Monat abgelaufen
# (HTTP 401) — seither laufen die Migrationen bei 401 über die direkte
# Datenbankverbindung SUPABASE_DB_URL (Session-Pooler, psql). Die Edge
# Functions brauchen weiterhin den Token; ohne gültigen Token werden ihre
# Schritte mit Warnung übersprungen statt den Lauf zu kippen.
name: Supabase Deploy

# Zwei Auslöser: von Hand (Actions-Tab, sobald der Workflow auf main liegt)
# ODER per Tag "supabase-deploy-*" — Letzteres, weil die GitHub-App der
# Claude-Umgebung workflow_dispatch nicht aufrufen darf, Tags pushen aber schon.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase Projekt-Ref"
        required: false
        default: "tdehljzmqwmfgfoyyoee"
        type: string
  push:
    tags:
      - "supabase-deploy-*"
    branches:
      - "supabase-deploy/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zugang vorhanden?
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] && [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::Weder SUPABASE_ACCESS_TOKEN noch SUPABASE_DB_URL als Repository-Secret vorhanden (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          [ -z "${SUPABASE_ACCESS_TOKEN}" ] && echo "::warning::SUPABASE_ACCESS_TOKEN fehlt — Migrationen laufen über die Datenbankverbindung, Edge Functions werden übersprungen."
          true

      - name: Migrationen einspielen + verifizieren
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PROJECT_REF: ${{ inputs.project_ref || 'tdehljzmqwmfgfoyyoee' }}
        run: |
          set -euo pipefail

          # Weg 1: Management-API (Token). Weg 2: psql über SUPABASE_DB_URL —
          # greift automatisch, sobald die API 401 meldet (Token abgelaufen)
          # oder gar kein Token da ist. Die Folge-Schritte (Edge Functions)
          # lesen API_OK aus GITHUB_ENV.
          MODE="api"
          [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && MODE="psql"
          echo "API_OK=1" >> "$GITHUB_ENV"

          # psql-Variante: eine Datei ausführen; /tmp/resp.json bekommt bei der
          # Historie-Abfrage dieselbe JSON-Form wie die API ([{"version":…}]).
          sql_psql() {
            [ -n "${SUPABASE_DB_URL:-}" ] || { echo "::error::Kein gültiger Token und kein SUPABASE_DB_URL — Migration nicht möglich."; return 1; }
            if [ "$1" = "/tmp/versions.sql" ]; then
              psql "${SUPABASE_DB_URL}" -X -At -v ON_ERROR_STOP=1 \
                -c "select coalesce(json_agg(json_build_object('version', version)), '[]'::json) from supabase_migrations.schema_migrations where version >= '${FLOOR}';" \
                > /tmp/resp.json
            else
              psql "${SUPABASE_DB_URL}" -X -q -v ON_ERROR_STOP=1 --single-transaction -f "$1" > /tmp/psql.out 2>&1 || { cat /tmp/psql.out; return 1; }
              echo "[]" > /tmp/resp.json
            fi
            echo "→ $1: HTTP 201 (psql)"
          }

          # SQL-Datei/-String ausführen. $2 = "weich": Fehler nur melden, Job läuft weiter.
          sql_datei() {
            if [ "$MODE" = "api" ]; then
              jq -Rs '{query: .}' < "$1" > /tmp/payload.json
              local http
              # Transportfehler (DNS/TLS/Timeout) dürfen die Zuweisung unter
              # set -e nicht sprengen — sie werden wie HTTP 000 behandelt.
              http=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
                -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
                -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                --data @/tmp/payload.json) || http="000"
              if [ "${http}" = "401" ]; then
                echo "::warning::Management-API meldet 401 (Token abgelaufen?) — Ausweichweg psql über SUPABASE_DB_URL. Bitte neuen Token unter Supabase → Account → Access Tokens anlegen und als Secret SUPABASE_ACCESS_TOKEN hinterlegen."
                MODE="psql"; sed -i 's/^API_OK=1$/API_OK=0/' "$GITHUB_ENV"
              else
                echo "→ $1: HTTP ${http}"
                cat /tmp/resp.json 2>/dev/null; echo
                if [ "${http}" -lt 200 ] || [ "${http}" -ge 300 ]; then
                  [ "${2:-}" = "weich" ] && { echo "(weicher Schritt — wird übersprungen)"; return 0; }
                  return 1
                fi
                return 0
              fi
            fi
            sql_psql "$1" || { [ "${2:-}" = "weich" ] && { echo "(weicher Schritt — wird übersprungen)"; return 0; }; return 1; }
          }

          # GENERISCH: alle noch nicht eingespielten Migrationen ab 20260818
          # anwenden (ältere Dateien verwaltet dieser Workflow bewusst NICHT —
          # ob sie in der Historie stehen, ist nicht garantiert, und ein
          # Doppel-Einspielen alter Migrationen wäre gefährlich).
          FLOOR="20260818000000"

          # Historie-Abfrage ist HART: Ohne verlässliche Antwort dürfen wir
          # NICHT einspielen — sonst liefen alle Dateien ab FLOOR erneut
          # (und z.B. Seed-Updates setzten Werte zurück).
          echo "select version from supabase_migrations.schema_migrations where version >= '${FLOOR}';" > /tmp/versions.sql
          sql_datei /tmp/versions.sql
          jq -r '.[].version // empty' /tmp/resp.json > /tmp/applied.txt \
            || { echo "::error::Antwort der Historie-Abfrage nicht lesbar — Abbruch statt Doppel-Einspielen."; exit 1; }
          echo "Bereits eingespielt (ab ${FLOOR}):"; cat /tmp/applied.txt || true

          NEU=0; ALT=0
          for f in supabase/migrations/*.sql; do
            base=$(basename "$f"); ver="${base%%_*}"
            # Version muss exakt 14 Ziffern sein — sonst würde ein Dateiname
            # ohne Unterstrich die Historie verfälschen.
            if ! [[ "$ver" =~ ^[0-9]{14}$ ]]; then
              echo "::warning::${base}: Versionspräfix nicht erkennbar — übersprungen."
              continue
            fi
            # nur Versionen ab FLOOR (String-Vergleich reicht bei 14 Ziffern)
            [ "$ver" \< "$FLOOR" ] && { ALT=$((ALT + 1)); continue; }
            if grep -qx "$ver" /tmp/applied.txt; then
              echo "✓ ${base} — bereits eingespielt, übersprungen"
              continue
            fi
            sql_datei "$f"
            # Historie-Eintrag ist HART: Scheitert er, gälte die Migration im
            # nächsten Lauf als offen und liefe erneut.
            name="${base#*_}"; name="${name%.sql}"
            printf "insert into supabase_migrations.schema_migrations (version, name, statements) values ('%s','%s', array['-- eingespielt ueber GitHub Action (Management-API oder psql)']) on conflict (version) do nothing;" "$ver" "$name" > /tmp/hist.sql
            sql_datei /tmp/hist.sql
            NEU=$((NEU + 1))
          done
          echo "ℹ ${ALT} Migration(en) vor ${FLOOR} verwaltet dieser Workflow bewusst nicht."
          echo "✓ ${NEU} neue Migration(en) eingespielt."

      - name: Edge Function mail-postfach deployen
        if: env.API_OK == '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project_ref || 'tdehljzmqwmfgfoyyoee' }}
        run: |
          set -euo pipefail
          npx --yes supabase@2 functions deploy mail-postfach --project-ref "${PROJECT_REF}" --use-api \
            || npx --yes supabase@2 functions deploy mail-postfach --project-ref "${PROJECT_REF}"
          echo "✓ mail-postfach deployt."

      - name: Edge Function sprache-zu-text deployen
        if: env.API_OK == '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project_ref || 'tdehljzmqwmfgfoyyoee' }}
        run: |
          set -euo pipefail
          npx --yes supabase@2 functions deploy sprache-zu-text --project-ref "${PROJECT_REF}" --use-api \
            || npx --yes supabase@2 functions deploy sprache-zu-text --project-ref "${PROJECT_REF}"
          echo "✓ sprache-zu-text deployt."

      - name: Edge Function bild-generieren deployen
        if: env.API_OK == '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project_ref || 'tdehljzmqwmfgfoyyoee' }}
        run: |
          set -euo pipefail
          npx --yes supabase@2 functions deploy bild-generieren --project-ref "${PROJECT_REF}" --use-api \
            || npx --yes supabase@2 functions deploy bild-generieren --project-ref "${PROJECT_REF}"
          echo "✓ bild-generieren deployt."

      - name: Edge Function wunsch-datei deployen
        if: env.API_OK == '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project_ref || 'tdehljzmqwmfgfoyyoee' }}
        run: |
          set -euo pipefail
          npx --yes supabase@2 functions deploy wunsch-datei --no-verify-jwt --project-ref "${PROJECT_REF}" --use-api \
            || npx --yes supabase@2 functions deploy wunsch-datei --no-verify-jwt --project-ref "${PROJECT_REF}"
          echo "✓ wunsch-datei deployt (ohne Gateway-JWT-Pruefung)."
