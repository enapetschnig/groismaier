# WEGWERF: service_role-Schluessel als Artefakt exportieren (fuer die
# Cockpit-Anbindung). Wird nach einmaligem Lauf sofort wieder entfernt,
# der Lauf selbst danach geloescht.
name: temp-schluessel
on: workflow_dispatch
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Schluessel holen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS "https://api.supabase.com/v1/projects/tdehljzmqwmfgfoyyoee/api-keys?reveal=true" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(k['api_key'] for k in d if k.get('name')=='service_role'))" > key.txt
          test -s key.txt
      - uses: actions/upload-artifact@v4
        with: { name: schluessel, path: key.txt, retention-days: 1 }
