name: temp-putzen
on: workflow_dispatch
jobs:
  putzen:
    runs-on: ubuntu-latest
    steps:
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 -c "import json; print(json.dumps({'query': \"DELETE FROM storage.objects WHERE bucket_id='employee-documents' AND name LIKE '%__test_km.pdf' RETURNING name;\"}))" \
          | curl -sS -X POST "https://api.supabase.com/v1/projects/tdehljzmqwmfgfoyyoee/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d @-
