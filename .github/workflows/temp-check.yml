name: temp-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          NAMEN=$(curl -sS "https://api.supabase.com/v1/projects/tdehljzmqwmfgfoyyoee/secrets" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | python3 -c "import json,sys; print(','.join(sorted(s['name'] for s in json.load(sys.stdin))))")
          echo "ERGEBNIS>>> ${NAMEN}"
