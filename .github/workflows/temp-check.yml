name: temp-check
on: workflow_dispatch
jobs:
  lesen:
    runs-on: ubuntu-latest
    steps:
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          Q() { A=$(python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$1" | curl -sS -X POST "https://api.supabase.com/v1/projects/tdehljzmqwmfgfoyyoee/database/query" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d @-); echo "ERGX $A"; }
          Q "SELECT i.nummer, i.status, i.netto_summe, i.updated_at FROM invoices i WHERE i.nummer IN ('A-2026-039','A-2026-037') ORDER BY i.nummer;"
          Q "SELECT it.position, left(it.beschreibung,45) AS b, it.menge, it.einheit, it.einzelpreis, it.gesamtpreis, it.gruppe, it.auf_pdf, it.ist_gruppensumme, it.ist_info, it.bereich FROM invoice_items it JOIN invoices i ON i.id=it.invoice_id WHERE i.nummer='A-2026-039' ORDER BY it.position;"
          Q "SELECT i.nummer, count(*) AS n FROM invoice_items it JOIN invoices i ON i.id=it.invoice_id WHERE it.gruppe IS NOT NULL AND NOT it.ist_gruppensumme AND abs(it.gesamtpreis)>0.004 GROUP BY i.nummer ORDER BY n DESC LIMIT 10;"
          Q "SELECT id, name, updated_at FROM kalkulationen WHERE id='6a309470-8ed9-4f8b-a94a-a1a24c866ff4';"
