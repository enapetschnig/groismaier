# WEGWERF: Cockpit-Verbindung eintragen + Zustellung testen, danach entfernt.
name: temp-aktivieren
on:
  workflow_dispatch:
    inputs:
      geheim: { required: true, type: string }
jobs:
  aktivieren:
    runs-on: ubuntu-latest
    steps:
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEHEIM: ${{ inputs.geheim }}
        run: |
          set -euo pipefail
          Q() {
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$1" \
            | curl -sS -X POST "https://api.supabase.com/v1/projects/tdehljzmqwmfgfoyyoee/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d @-
          }
          echo "1) Verbindung eintragen"
          Q "INSERT INTO public.cockpit_verbindung (url, secret, app_key)
             VALUES ('https://app.epowergmbh.at/api/wuensche-eingang', '${GEHEIM}', 'groismaier')
             ON CONFLICT (einzig) DO UPDATE SET url = EXCLUDED.url, secret = EXCLUDED.secret
             RETURNING url, app_key;"
          echo ""
          echo "2) Test-Wunsch anlegen (Trigger feuert)"
          Q "INSERT INTO public.aenderungswuensche (text, art, seite)
             VALUES ('__Cockpit-Funktionstest bitte ignorieren', 'wunsch', '/test') RETURNING id;"
          echo ""
          sleep 6
          echo "3) Zustell-Ergebnis (pg_net-Antwortprotokoll)"
          Q "SELECT status_code, LEFT(COALESCE(error_msg,''),120) AS fehler, LEFT(content::text,160) AS antwort
               FROM net._http_response ORDER BY id DESC LIMIT 2;"
          echo ""
          echo "4) Test-Wunsch wieder loeschen"
          Q "DELETE FROM public.aenderungswuensche WHERE text LIKE '\_\_Cockpit-Funktionstest%' RETURNING id;"
