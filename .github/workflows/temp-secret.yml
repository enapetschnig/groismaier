# WEGWERF: COCKPIT_SECRET als Edge-Function-Secret setzen, danach entfernt.
name: temp-secret
on:
  workflow_dispatch:
    inputs:
      wert: { required: true, type: string }
jobs:
  setzen:
    runs-on: ubuntu-latest
    steps:
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WERT: ${{ inputs.wert }}
        run: |
          set -euo pipefail
          curl -sS -X POST "https://api.supabase.com/v1/projects/tdehljzmqwmfgfoyyoee/secrets" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" \
            -d "[{\"name\":\"COCKPIT_SECRET\",\"value\":\"${WERT}\"}]" -o /dev/null -w "Secret gesetzt: HTTP %{http_code}\n"
