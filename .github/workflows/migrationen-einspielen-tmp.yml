# TEMPORÄR: Die zwei neuen Migrationen (Sendeprotokoll + Wünsche-Abschluss)
# in die Live-Datenbank einspielen und den Stand der Änderungswünsche prüfen.
# Wird direkt nach dem erfolgreichen Lauf wieder entfernt. Grund wie bei der
# Wünsche-Abholung: Der direkte Weg zur Supabase-API ist aus der
# Entwicklungsumgebung heraus von der Netz-Policy gesperrt — das Repo-Secret
# in der CI darf, und so bleibt der Zugang auch hier im Haus.
name: Migrationen einspielen (temporär)

on:
  push:
    branches: [claude/implement-requested-changes-yi1wqq]

concurrency:
  group: migrationen-einspielen-tmp
  cancel-in-progress: false

jobs:
  einspielen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrationen ausführen + Wünsche prüfen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: tdehljzmqwmfgfoyyoee
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "::error::Secret fehlt."; exit 1; }
          python3 - <<'PY'
          import json, os, sys, urllib.request

          ref = os.environ["PROJECT_REF"]
          token = os.environ["SUPABASE_ACCESS_TOKEN"]

          def query(sql, name):
              req = urllib.request.Request(
                  f"https://api.supabase.com/v1/projects/{ref}/database/query",
                  data=json.dumps({"query": sql}).encode(),
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req) as r:
                      out = json.loads(r.read().decode() or "null")
                  print(f"== {name}: OK")
                  return out
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  print(f"== {name}: FEHLER {e.code}: {body}")
                  raise

          # 0) Wie wurden Migrationen bisher verbucht? (nur Info)
          try:
              hist = query("""
                SELECT version, name FROM supabase_migrations.schema_migrations
                 ORDER BY version DESC LIMIT 8
              """, "Migrations-Historie")
              print(json.dumps(hist, ensure_ascii=False, indent=1))
          except Exception:
              print("(keine supabase_migrations-Tabelle — Historie übersprungen)")

          # 1) Stand der Wünsche VOR dem Einspielen (inkl. eventuell NEUER Meldungen)
          vorher = query("""
            SELECT w.id, w.created_at, w.art, w.status, w.seite, w.abschrift,
                   w.text,
                   COALESCE(p.vorname || ' ' || p.nachname, '') AS melder
              FROM aenderungswuensche w
              LEFT JOIN profiles p ON p.id = w.erstellt_von
             ORDER BY w.created_at
          """, "Wünsche vorher")
          print("WUENSCHE_VORHER_JSON " + json.dumps(vorher, ensure_ascii=False))

          # 2) Die zwei neuen Migrationen der Reihe nach ausführen
          for datei in (
              "supabase/migrations/20260828100000_beleg_sendeprotokoll.sql",
              "supabase/migrations/20260828110000_wuensche_2708_2808_abschliessen.sql",
          ):
              sql = open(datei, encoding="utf-8").read()
              query(sql, f"Migration {os.path.basename(datei)}")

          # 3) In der Migrations-Historie verbuchen (falls es sie gibt), damit
          #    ein späteres `supabase db push` die Dateien nicht doppelt fährt.
          query("""
            DO $$ BEGIN
              INSERT INTO supabase_migrations.schema_migrations(version, name)
              VALUES ('20260828100000','beleg_sendeprotokoll') ON CONFLICT DO NOTHING;
              INSERT INTO supabase_migrations.schema_migrations(version, name)
              VALUES ('20260828110000','wuensche_2708_2808_abschliessen') ON CONFLICT DO NOTHING;
            EXCEPTION WHEN undefined_table OR insufficient_privilege OR undefined_column THEN NULL;
            END $$;
          """, "Historie verbuchen")

          # 4) Kontrolle: Tabelle da? Wünsche geschlossen? Neuerungen drin?
          tab = query("""
            SELECT COUNT(*) AS spalten FROM information_schema.columns
             WHERE table_schema='public' AND table_name='beleg_sendeprotokoll'
          """, "Tabelle beleg_sendeprotokoll")
          print(json.dumps(tab))
          nachher = query("""
            SELECT id, art, status, LEFT(COALESCE(antwort,''), 70) AS antwort
              FROM aenderungswuensche ORDER BY created_at
          """, "Wünsche nachher")
          print("WUENSCHE_NACHHER_JSON " + json.dumps(nachher, ensure_ascii=False))
          neu = query("""
            SELECT titel, aenderungswunsch_id IS NOT NULL AS verknuepft
              FROM neuerungen ORDER BY created_at DESC LIMIT 10
          """, "Neuerungen")
          print("NEUERUNGEN_JSON " + json.dumps(neu, ensure_ascii=False))
          PY
