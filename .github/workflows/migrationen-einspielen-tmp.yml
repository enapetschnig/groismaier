# TEMPORÄR: Datenkorrektur-Migration (Schindlböck-Rechnung) einspielen,
# mit Vorher/Nachher-Kontrolle in den Logs. Wird nach dem Lauf entfernt.
name: Migrationen einspielen (temporär)

on:
  push:
    branches: [claude/implement-requested-changes-yi1wqq]

concurrency:
  group: migrationen-einspielen-tmp
  cancel-in-progress: false

jobs:
  einspielen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migration ausführen + Kontrolle
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: tdehljzmqwmfgfoyyoee
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "::error::Secret fehlt."; exit 1; }
          python3 - <<'PY'
          import json, os, urllib.request

          ref = os.environ["PROJECT_REF"]
          token = os.environ["SUPABASE_ACCESS_TOKEN"]

          def query(sql, name):
              req = urllib.request.Request(
                  f"https://api.supabase.com/v1/projects/{ref}/database/query",
                  data=json.dumps({"query": sql}).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "curl/8.5.0",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req) as r:
                      out = json.loads(r.read().decode() or "null")
                  print(f"== {name}: OK")
                  return out
              except urllib.error.HTTPError as e:
                  print(f"== {name}: FEHLER {e.code}: {e.read().decode()}")
                  raise

          INV = "b8a201d3-524c-4c96-933d-36a80a7b84ca"

          kontrolle = f"""
            SELECT i.status, i.netto_summe, i.mwst_betrag, i.brutto_summe,
                   (SELECT json_agg(json_build_object(
                        'pos', it.position, 'beschreibung', it.beschreibung,
                        'menge', it.menge, 'einheit', it.einheit,
                        'einzelpreis', it.einzelpreis, 'gesamtpreis', it.gesamtpreis)
                        ORDER BY it.position)
                      FROM invoice_items it WHERE it.invoice_id = i.id) AS items
              FROM invoices i WHERE i.id = '{INV}'
          """
          vorher = query(kontrolle, "Rechnung vorher")
          print("VORHER " + json.dumps(vorher, ensure_ascii=False))

          berichte = query("""
            SELECT d.datum, d.start_time, d.end_time, d.stunden, d.kunde_name,
                   (SELECT COUNT(*) FROM disturbance_workers w WHERE w.disturbance_id = d.id) AS mitarbeiter
              FROM disturbances d
             WHERE d.kunde_name ILIKE '%schind%'
             ORDER BY d.datum
          """, "Regieberichte Schindlböck")
          print("BERICHTE " + json.dumps(berichte, ensure_ascii=False, default=str))

          sql = open("supabase/migrations/20260828140000_schindlboeck_rechnung_stunden.sql", encoding="utf-8").read()
          query(sql, "Migration 20260828140000")

          query("""
            DO $$ BEGIN
              INSERT INTO supabase_migrations.schema_migrations(version, name)
              VALUES ('20260828140000','schindlboeck_rechnung_stunden') ON CONFLICT DO NOTHING;
            EXCEPTION WHEN undefined_table OR insufficient_privilege OR undefined_column THEN NULL;
            END $$;
          """, "Historie verbuchen")

          nachher = query(kontrolle, "Rechnung nachher")
          print("NACHHER " + json.dumps(nachher, ensure_ascii=False))
          PY
